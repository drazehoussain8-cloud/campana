<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e3b4a">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="img/favicon.png">
<title>Menu · Campana Chez Fati</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="menu">
<main>
  <section class="phero"><div class="wrap"><h1 data-t="menu_t"></h1><p data-t="menu_d"></p></div></section>

  <section class="wrap sec">
    <div class="card set rv">
      <div class="ico-c"><i class="ico" data-i="utensils"></i></div>
      <h2 class="sec-t" style="margin-bottom:6px" data-t="set_t"></h2>
      <p style="color:var(--muted)" data-t="set_d"></p>
      <div class="courses">
        <span class="chip"><i class="ico" data-i="salad"></i><span data-t="c1"></span></span>
        <span class="chip"><i class="ico" data-i="utensils"></i><span data-t="c2"></span></span>
        <span class="chip"><i class="ico" data-i="heart"></i><span data-t="c3"></span></span>
      </div>
      <span class="price" data-price></span>
    </div>
  </section>

  <section class="wrap sec">
    <h2 class="sec-t" data-t="spec_t"></h2>
    <div class="grid g2">
      <div class="card sp rv"><div class="ico-c sage"><i class="ico" data-i="leaf"></i></div><div><h3 data-t="sp1_t"></h3><p data-t="sp1_d"></p></div></div>
      <div class="card sp rv"><div class="ico-c"><i class="ico" data-i="utensils"></i></div><div><h3 data-t="sp2_t"></h3><p data-t="sp2_d"></p></div></div>
      <div class="card sp rv"><div class="ico-c"><i class="ico" data-i="waves"></i></div><div><h3 data-t="sp3_t"></h3><p data-t="sp3_d"></p></div></div>
      <div class="card sp rv"><div class="ico-c"><i class="ico" data-i="heart"></i></div><div><h3 data-t="sp4_t"></h3><p data-t="sp4_d"></p></div></div>
      <div class="card sp rv"><div class="ico-c sage"><i class="ico" data-i="cup"></i></div><div><h3 data-t="sp5_t"></h3><p data-t="sp5_d"></p></div></div>
    </div>
    <p class="note"><span data-t="note_menu"></span> <span data-t="cash"></span></p>
  </section>

  <section class="wrap sec">
    <div class="cta rv">
      <h2 data-t="cta_t"></h2>
      <p data-t="cta_d"></p>
      <a class="btn wa" data-wa target="_blank" rel="noopener"><i class="ico" data-i="chat"></i><span data-t="cta_reserve"></span></a>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
