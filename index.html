    </div>
    <div class="waves" aria-hidden="true">

      <svg class="w2" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d=""/></svg>
      <svg class="w1" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d=""/></svg>

      <p data-t="cta_d"></p>
      <a class="btn wa" data-wa target="_blank" rel="noopener"><i class="ico" data-i="chat"></i><span data-t="cta_reserve"></span></a>
